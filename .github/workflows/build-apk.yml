name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Conferir Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FoneControl-${{ github.run_number }}.apk

      - name: Guardar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: FoneControl-apk
          path: FoneControl-${{ github.run_number }}.apk

      - name: Publicar em Releases (fácil de baixar pelo celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Fone Control (build ${{ github.run_number }})
          body: APK de teste gerado automaticamente. Baixe o arquivo .apk abaixo e instale no celular.
          files: FoneControl-${{ github.run_number }}.apk
